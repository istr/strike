# Rebuild strike from source to prove reproducibility.
# Run by stage_2 inside the built strike image with source at /src.
name: strike-bootstrap
id: strike-bootstrap
registry: localhost/strike-bootstrap

resolver:
  adn: one.one.one.one
  ip: 1.1.1.1
  trust:
    cert: ""
oidc:
  issuer: "https://idp.example.com"
  audience: "strike"
  identity: "strike@example.com"
  trust:
    cert: ""
keyless:
  endpoints:
    fulcio:
      url: "https://fulcio.example:5555"
      trust:
        cert: ""
    rekor:
      url: "https://rekor.example:3003"
      trust:
        cert: ""
    tsa:
      url: "https://tsa.example:3004"
      trust:
        cert: ""

steps:
  - id: build-binary
    image: cgr.dev/chainguard/go@sha256:0a0ba6cee2d535a4e9dcc63d4230be546d3c4c6631b23bc9989992711317649f
    args: [build, -C, /src, -trimpath, "-buildvcs=false", "-ldflags=-s -w", -o, /out/strike, ./cmd/strike]
    workdir: /out
    env:
      CGO_ENABLED: "0"
    peers:
      - type: https
        host: proxy.golang.org
        trust:
          cert: ""
      - type: https
        host: sum.golang.org
        trust:
          cert: ""
    inputs:
      - from:
          step: src
          output: tree
        mount: /src
    outputs:
      - id: binary
        type: file
        path: strike

  - id: build-image
    pack:
      base: cgr.dev/chainguard/static@sha256:2fdfacc8d61164aa9e20909dceec7cc28b9feb66580e8e1a65b9f2443c53b61b
      files:
        - from:
            step: build-binary
            output: binary
          dest: /usr/bin/strike
          mode: 0o755
    outputs:
      - id: image
        type: image
        path: image.tar
