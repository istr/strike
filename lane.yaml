# The bootstrap lane of the reproducibility proof
# (docs/ADR-009-bootstrap-reproducibility-proof.md). The source step fetches
# the pinned commit, so no step reads a tree baked into an image; the commit
# pin follows docs/RELEASES.md.
#
# The resolver, oidc, keyless and registry-target values validate but are
# placeholders: every TLS anchor is the fixture anchor of
# docs/FIXTURE-TRUST-ANCHOR.md and every endpoint is an example name. The lane
# validates; it does not run until they are replaced.
name: strike-bootstrap
id: strike-bootstrap
secrets: {}

resolver:
  adn: one.one.one.one
  ip: 1.1.1.1
  trust:
    cert: ""
oidc:
  issuer: "https://idp.example.com"
  audience: "strike"
  identity: "strike@example.com"
  trust:
    cert: ""
keyless:
  endpoints:
    fulcio:
      url: "https://fulcio.example:5555"
      trust:
        cert: ""
    rekor:
      url: "https://rekor.example:3003"
      trust:
        cert: ""
    tsa:
      url: "https://tsa.example:3004"
      trust:
        cert: ""

steps:
  - id: source
    image: cgr.dev/chainguard/git@sha256:ad0d6854943a045ff64c9894703201c8ec5469265ec0cfd44109d068f5a955a2
    args:
      - clone
      - --revision=4a4fe492a9e408188b214c8d563fe369d75ffe7c
      - --depth=1
      - --separate-git-dir=/out/git
      - https://github.com/istr/strike
      - /out/tree
    workdir: /out
    env: {}
    inputs: []
    secrets: []
    peers:
      - type: https
        host: github.com
        trust:
          cert: ""
    outputs:
      - id: tree
        type: directory
        path: tree

  - id: generate
    image: cgr.dev/chainguard/go@sha256:0a0ba6cee2d535a4e9dcc63d4230be546d3c4c6631b23bc9989992711317649f
    args: [generate, ./contract]
    workdir: /src
    env: {}
    inputs:
      - from:
          step: source
          output: tree
        mount: /src
    secrets: []
    peers:
      - type: https
        host: proxy.golang.org
        trust:
          cert: ""
      - type: https
        host: sum.golang.org
        trust:
          cert: ""
    outputs:
      - id: tree
        type: directory

  - id: build-binary
    image: cgr.dev/chainguard/go@sha256:0a0ba6cee2d535a4e9dcc63d4230be546d3c4c6631b23bc9989992711317649f
    args: [build, -C, /src, -trimpath, "-buildvcs=false", "-ldflags=-s -w", -o, /out/strike, ./cmd/strike]
    workdir: /out
    env:
      CGO_ENABLED: "0"
    inputs:
      - from:
          step: generate
          output: tree
        mount: /src
    secrets: []
    peers:
      - type: https
        host: proxy.golang.org
        trust:
          cert: ""
      - type: https
        host: sum.golang.org
        trust:
          cert: ""
    outputs:
      - id: binary
        type: file
        path: strike

  - id: build-image
    pack:
      base: cgr.dev/chainguard/static@sha256:2fdfacc8d61164aa9e20909dceec7cc28b9feb66580e8e1a65b9f2443c53b61b
      files:
        - from:
            step: build-binary
            output: binary
          dest: /usr/bin/strike
          mode: 0o755
    args: []
    env: {}
    inputs: []
    secrets: []
    output: image

  - id: publish
    deploy:
      method:
        type: registry
        target:
          host: registry.example.com
          trust:
            cert: ""
          name: istr/strike
      artifacts:
        strike:
          step: build-image
      recording:
        preState:
          required: false
          captures: []
        postState:
          required: false
          captures: []
    args: []
    env: {}
    inputs: []
    secrets: []
    outputs: []
