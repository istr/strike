name: hugo
id: hugo
secrets: {}
resolver:
  adn: one.one.one.one
  ip: 1.1.1.1
  trust:
    cert: ""
oidc:
  issuer: "https://idp.example.com"
  audience: "strike"
  identity: "strike@example.com"
  trust:
    cert: ""
keyless:
  endpoints:
    fulcio:
      url: "https://fulcio.example:5555"
      trust:
        cert: ""
    rekor:
      url: "https://rekor.example:3003"
      trust:
        cert: ""
    tsa:
      url: "https://tsa.example:3004"
      trust:
        cert: ""
steps:
  - id: source
    image: docker.io/library/busybox@sha256:abababababababababababababababababababababababababababababababab
    args: [git, clone, --depth, "1", "https://example.com/site.git", /work/tree]
    workdir: /work
    peers:
      - type: https
        host: example.com
        trust:
          cert: ""
    env: {}
    inputs: []
    secrets: []
    outputs:
      - id: tree
        type: directory
        path: tree
    provenance:
      type: git
      path: tree/provenance.json

  - id: npm-install
    image: docker.io/library/node@sha256:cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd
    args: [npm, ci, --ignore-scripts, --no-bin-links]
    workdir: /work
    peers:
      - type: https
        host: registry.npmjs.org
        trust:
          cert: ""
    env:
      npm_config_cache: /tmp/.npm
    inputs:
      - from:
          step: source
          output: tree
        subpath: package.json
        mount: /work/package.json
      - from:
          step: source
          output: tree
        subpath: package-lock.json
        mount: /work/package-lock.json
    secrets: []
    outputs:
      - id: node-modules
        type: directory
        path: node_modules

  - id: workspace
    args: []
    env: {}
    inputs: []
    secrets: []
    pack:
      base: docker.io/library/busybox@sha256:efefefefefefefefefefefefefefefefefefefefefefefefefefefefefefefef
      files:
        - from:
            step: source
            output: tree
          dest: /work
        - from:
            step: npm-install
            output: node-modules
          dest: /work/node_modules
    output: image

  - id: build
    imageFromStep: workspace
    args: [hugo, --gc, --minify, -d, /work/public]
    workdir: /work
    env: {}
    inputs: []
    secrets: []
    outputs:
      - id: site
        type: directory
        path: public

  - id: pack-site
    args: []
    env: {}
    inputs: []
    secrets: []
    pack:
      base: docker.io/library/busybox@sha256:efefefefefefefefefefefefefefefefefefefefefefefefefefefefefefefef
      files:
        - from:
            step: build
            output: site
          dest: /usr/share/nginx/html
      config:
        entrypoint: [nginx, -g, "daemon off;"]
    output: image

  - id: deploy
    deploy:
      method:
        type: registry
        target:
          host: registry.example.com
          trust:
            cert: ""
          name: hugo/site
      artifacts:
        app:
          step: pack-site
      recording:
        preState:
          required: false
          captures: []
        postState:
          required: false
          captures: []
    args: []
    env: {}
    inputs: []
    secrets: []
    outputs: []
