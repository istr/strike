# Local sigstore stack for the strike keyless harness (H1).
# Rootless-Podman-compatible; also runs under docker compose.
# TLS terminated by Caddy (internal CA); hostname resolved via sslip.io.
# Not part of the strike trusted binary.
name: strike-sigstore-local

networks:
  sigstore:
    driver: bridge

volumes:
  posix_storage: {}
  caddy_data: {}
  ct_storage: {}

services:
  caddy:
    # TLS terminator + reverse proxy for Keycloak.
    image: caddy:2.11.7@sha256:04913b1da43339a40ad1ea87827d70a576ac5aa6cf674c6e24fdca675887533a
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    # Only the internal CA under /data/caddy/pki persists; leaf certificates
    # are issued fresh on every start. A persisted leaf that expired past
    # Caddy's grace period is deleted at start while renewal still needs its
    # key, and Caddy then keeps serving the expired leaf until restarted.
    # notmpcopyup keeps the tmpfs empty: podman's default copies the leaves
    # already stored in caddy_data into it.
    tmpfs:
      - /data/caddy/certificates:notmpcopyup
    networks:
      sigstore:
        aliases:
          # In-network resolution of the canonical issuer host overrides
          # sslip.io; must equal the issuer hostname character for character.
          - keycloak.127.0.0.1.sslip.io
          # Fulcio submits issuance to the CT log in-network over TLS; the alias
          # routes the CT host to Caddy, which fronts tesseract.
          - ct.127.0.0.1.sslip.io
    ports:
      - "8443:8443"
      - "5555:5555"
      - "3003:3003"
      - "3004:3004"
      - "6962:6962"
      - "5443:5443"
    depends_on:
      keycloak:
        condition: service_started

  keycloak:
    # HTTP-only behind Caddy.
    image: quay.io/keycloak/keycloak:26.8.1@sha256:de6ed510b59cfcd25f129ba4118696fa10d4165eee921a8d846178b6d35d30f7
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Full external URL so iss and discovery match the canonical issuer.
      KC_HOSTNAME: https://keycloak.127.0.0.1.sslip.io:8443
      # Trust the proxy's forwarded scheme/host (Caddy sets X-Forwarded-*).
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - sigstore
    # No host port: only Caddy reaches Keycloak, in-network at keycloak:8080.

  fulcio:
    image: gcr.io/projectsigstore/fulcio:v1.9.1@sha256:7ca84b9e94fc56dc83f251e2e896371054656580a2a2e8f3613cefad270dcba8
    command:
      - serve
      - --port=5555
      - --ca=fileca
      - --fileca-cert=/pki/fulcio-root.crt
      - --fileca-key=/pki/fulcio-root.key
      - --fileca-key-passwd=fulcio
      - --ct-log-url=https://ct.127.0.0.1.sslip.io:6962/strike-ct
      - --config-path=/etc/fulcio/config.yaml
    volumes:
      - ./fulcio/config.yaml:/etc/fulcio/config.yaml:ro
      - ./pki/caddy-root.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./pki:/pki:ro
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    networks:
      - sigstore
    depends_on:
      keycloak:
        condition: service_started
      tesseract:
        condition: service_started
    # No container healthcheck: the image lacks a shell for a TCP probe.
    # Functional readiness is the issuer poll in `make up` and the next
    # instruction's sign test.

  rekor:
    # Rekor v2 POSIX (tile/Tessera), no Trillian/DB.
    image: ghcr.io/sigstore/rekor-tiles/posix:v2.4.1@sha256:6e0495782d56f640c0c6a357762a92ff94f68b3446e57d358777a45a81d55a31
    command:
      - rekor-server
      - serve
      - --http-address=0.0.0.0
      - --grpc-address=0.0.0.0
      - --hostname=rekor.localhost
      - --storage-dir=/data/log
      - --signer-filepath=/pki/rekor-ed25519.pem
      - --checkpoint-interval=2s
      - --log-level=debug
    volumes:
      - ./pki:/pki:ro
      - posix_storage:/data/log:U
    networks:
      - sigstore
    # No container healthcheck and no depends_on: readiness is polled
    # functionally from the Makefile against the published port. rekor writes
    # its tiles to the storage dir directly; no HTTP tile server is needed for
    # the sign/verify round trip (the inclusion proof is returned at upload and
    # persisted in the bundle; the tile read API is for log monitors only).

  # In-network probe (same DNS vantage as Fulcio). Not started by `up`.
  # podman compose run --rm probe -sk <url>
  probe:
    profiles: ["tools"]
    # Entrypoint is curl; args follow `run probe`.
    image: curlimages/curl:8.23.0@sha256:3b8fde20978e330b401837f24b871ebe2c8d14ff7f07b87990bcd832588a1a75
    networks:
      - sigstore

  # Off by default. Enable only if rekor refuses to serve without a witness
  # (first-run risk R-2): podman compose --profile witness up
  witness:
    profiles: ["witness"]
    build:
      context: https://github.com/transparency-dev/witness.git#main
      dockerfile: cmd/omniwitness/Dockerfile
    networks:
      - sigstore

  tsa:
    # Rekor v2 supplies no integrated timestamp (Path 1); keyless bundles carry
    # an RFC3161 timestamp from this TSA. Memory signer: self-signed TSA cert,
    # chain fetched via `make tsa-certchain` (GET /api/v1/timestamp/certchain).
    image: ghcr.io/sigstore/timestamp-server:v2.2.0@sha256:77c615f0bef6ddd907b531099cd1a8cf8f698ca9a08b1abf7397b222c9352306
    command:
      - timestamp-server
      - serve
      - --host=0.0.0.0
      - --port=3000
      - --timestamp-signer=memory
      - --timestamp-signer-hash=sha256
    networks:
      - sigstore

  tesseract:
    # Static-CT-API CT log on Tessera (POSIX) -- the CTFE, no Trillian. In-network
    # only: cosign never dials it; the SCT is embedded in the leaf at issuance and
    # verified offline against the ctfe key in the trusted root. Distroless/nonroot
    # (no shell) -- no container healthcheck; /healthz is on the root mux and is
    # polled functionally from `make up`.
    image: ghcr.io/transparency-dev/tesseract/posix:v0.2.0@sha256:80059f05b7a02ce7d5d9730b66bc7e56035fc0e77f41fd76dd067af91bcdebce
    command:
      - --private_key=/pki/ctfe.key
      - --origin=strike-ct
      - --path_prefix=strike-ct
      - --storage_dir=/data/ct
      - --roots_pem_file=/pki/fulcio-root.crt
      - --ext_key_usages=CodeSigning
      - --http_endpoint=0.0.0.0:6962
    environment:
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
    volumes:
      - ./pki:/pki:ro
      - ct_storage:/data/ct:U
    networks:
      - sigstore

  zot:
    # OCI 1.1 registry, minimal build (no extensions, no web UI). HTTP-only
    # behind Caddy. Serves the referrers API server-side: subject-bearing
    # pushes return Oci-Subject, artifactType is derived from the config media
    # type, and no OCI 1.0 fallback tag is created. Storage is the container's
    # writable layer, so every bring-up starts from an empty registry.
    # Authentication is bearer.oidc against the harness issuer: zot validates
    # the registry token itself and advertises no bearer realm, so a client
    # presents the token or reads anonymously, and never exchanges a token.
    # Only the pinned harness identity may push; public/** also admits
    # anonymous reads, every other repository none. The mounted Caddy root
    # lets zot fetch the issuer's keys over TLS.
    image: ghcr.io/project-zot/zot-minimal-linux-amd64:v2.1.22@sha256:27729292c45f1dc0a323b69292d15cc13a5ca4b8bf05f81106e7f89a2b1abd08
    volumes:
      - ./zot/config.json:/etc/zot/config.json:ro
      - ./pki/caddy-root.crt:/etc/zot/issuer-ca.crt:ro
    networks:
      - sigstore

  coredns:
    # DoT resolver for the mandatory lane resolver field. Not behind Caddy:
    # DNS-over-TLS is not HTTP, so CoreDNS terminates TLS itself under
    # pki/resolver.crt -- a separate anchor from the Caddy internal root.
    # Serves a synthetic root zone with no forwarder and no root hints, which
    # is what lets the run-start NS . probe be answered with no egress.
    image: docker.io/coredns/coredns:1.15.0@sha256:3429e3bbffb1e839470c4a3541d4d78aca84a1394c75a539d0200c58c63196ac
    command:
      - -conf
      - /etc/coredns/Corefile
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
      - ./coredns/root.zone:/etc/coredns/root.zone:ro
      - ./pki:/pki:ro
    networks:
      - sigstore
    ports:
      - "8853:853"
