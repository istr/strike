name: not-pinned
id: not-pinned
secrets: {}
resolver:
  adn: one.one.one.one
  ip: 1.1.1.1
  trust:
    cert: ""
oidc:
  issuer: "https://idp.example.com"
  audience: "strike"
  identity: "strike@example.com"
  trust:
    cert: ""
keyless:
  endpoints:
    fulcio:
      url: "https://fulcio.example:5555"
      trust:
        cert: ""
    rekor:
      url: "https://rekor.example:3003"
      trust:
        cert: ""
    tsa:
      url: "https://tsa.example:3004"
      trust:
        cert: ""
steps:
  - id: build
    image: golang@sha256:abc123
    args: [go, build]
    env: {}
    inputs: []
    secrets: []
    outputs:
      - id: binary
        type: file
        path: binary
