name: peers-https-fp
id: peers-https-fp
secrets: {}
resolver:
  adn: one.one.one.one
  ip: 1.1.1.1
  trust:
    cert: ""
oidc:
  issuer: "https://idp.example.com"
  audience: "strike"
  identity: "strike@example.com"
  trust:
    cert: ""
keyless:
  endpoints:
    fulcio:
      url: "https://fulcio.example:5555"
      trust:
        cert: ""
    rekor:
      url: "https://rekor.example:3003"
      trust:
        cert: ""
    tsa:
      url: "https://tsa.example:3004"
      trust:
        cert: ""
steps:
  - id: fetch
    image: docker.io/library/alpine@sha256:abababababababababababababababababababababababababababababababab
    args: [wget, "https://example.com/file"]
    workdir: /out
    env: {}
    inputs: []
    secrets: []
    outputs:
      - id: file
        type: file
        path: file
    peers:
      - type: https
        host: example.com
        trust:
          cert: ""

  - id: deploy
    deploy:
      method:
        type: registry
        target:
          host: registry.example.com
          trust:
            cert: ""
          name: app
      recording:
        preState:
          required: false
          captures: []
        postState:
          required: false
          captures: []
    args: []
    env: {}
    inputs: []
    secrets: []
    outputs: []
