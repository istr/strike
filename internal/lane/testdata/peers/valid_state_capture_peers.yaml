name: peers-state-capture
id: peers-state-capture
secrets: {}
resolver:
  adn: one.one.one.one
  ip: 1.1.1.1
  trust:
    cert: ""
oidc:
  issuer: "https://idp.example.com"
  audience: "strike"
  identity: "strike@example.com"
  trust:
    cert: ""
keyless:
  endpoints:
    fulcio:
      url: "https://fulcio.example:5555"
      trust:
        cert: ""
    rekor:
      url: "https://rekor.example:3003"
      trust:
        cert: ""
    tsa:
      url: "https://tsa.example:3004"
      trust:
        cert: ""
steps:
  - id: build
    image: docker.io/library/alpine@sha256:abababababababababababababababababababababababababababababababab
    args: [touch, /out/binary]
    workdir: /out
    env: {}
    inputs: []
    secrets: []
    output: image
  - id: deploy
    deploy:
      method:
        type: registry
        target:
          host: registry.example.com
          trust:
            cert: ""
          name: peers/app
      artifacts:
        app:
          step: build
      recording:
        preState:
          required: false
          captures:
            - id: probe
              image: alpine@sha256:1111111111111111111111111111111111111111111111111111111111111111
              command: [cat, /version]
              peers:
                - type: https
                  host: api.example.com
                  trust:
                    cert: ""
        postState:
          required: false
          captures: []
    args: []
    env: {}
    inputs: []
    secrets: []
    outputs: []
