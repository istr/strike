  <text x="440" y="130" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Control plane</text>
  <text x="440" y="148" font-size="12" fill="#5F5E5A" text-anchor="middle">assembles, verifies, seals, pushes</text>

  <rect x="630" y="104" width="270" height="762" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"></rect>
  <text x="765" y="130" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Registry</text>
