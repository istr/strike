  <text x="226" y="527" font-size="11" fill="#0F6E56" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">export: checked on arrival</text>
  <text x="226" y="527" font-size="11" fill="#0F6E56" text-anchor="middle">export: checked on arrival</text>
  <text x="226" y="556" font-size="10" fill="#5F5E5A" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">re-encoded: E differs from P</text>
