  <text x="210" y="86" font-size="12" fill="#5F5E5A">produced manifest digest P</text>
  <rect x="385" y="75" width="14" height="14" rx="3" fill="#E4F0EB" stroke="#0F6E56" stroke-width="0.75"></rect>
  <text x="405" y="86" font-size="12" fill="#5F5E5A">produced config digest C</text>
  <rect x="570" y="75" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"></rect>
  <text x="590" y="86" font-size="12" fill="#5F5E5A">pushed digest E</text>

