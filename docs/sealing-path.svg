<svg xmlns="http://www.w3.org/2000/svg" width="990" height="1000" viewBox="0 0 990 1000" role="img" font-family="ui-sans-serif, system-ui, -apple-system, &#39;Segoe UI&#39;, sans-serif">
  <title>Registry deploy sealing path</title>
  <desc>Data flow across the engine, the control plane, and the registry on a registry deploy. Both image producers -- the committed step container and the in-process pack assembly -- converge on one wrap-and-load core that computes two produced identities: the manifest digest P, which the engine store is checked against and which the attestation records, and the config blob digest C, the round-trip-stable anchor the engine export is later verified against. A step a deploy seals bypasses the cache, because a cached handle would carry no C. The export is checked against C and against every layer diff_id before the push transport is built; the push produces a third digest E, which the registry serves and which becomes the in-toto subject of every published statement. The control plane attaches the signed statement bundles as OCI referrers of E over the same trust-anchored transport. An independent verifier, outside all three lanes, reads the evidence set from the referrers of E and dereferences E itself, hash-checking the received bytes (C3).</desc>
