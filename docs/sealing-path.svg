    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F6E56"></path></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6A64"></path></marker>
  </defs>
  <rect x="0" y="0" width="990" height="1000" fill="#FFFFFF"></rect>

  <text x="40" y="38" font-size="18" font-weight="500" fill="#2C2C2A">Registry deploy sealing path</text>
  <text x="40" y="58" font-size="12" fill="#5F5E5A">Every handoff checked; the seal names the pushed digest E, the record keeps the produced digest P (ADR-051 D4/D6/D10, ADR-046)</text>

